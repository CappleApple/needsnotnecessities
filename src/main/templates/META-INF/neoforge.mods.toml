modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="needs_not_necessities.png"
authors="cappleapple"
description='''
A configurable survival framework that rewards preparation without turning survival into constant maintenance.
'''

[[mixins]]
config="needs_not_necessities.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="quality_food"
type="optional"
versionRange="[2.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="panelsnotscreens"
type="required"
versionRange="[0.1.0,)"
ordering="AFTER"
side="CLIENT"
